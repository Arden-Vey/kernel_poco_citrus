name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernelname:
        description: 'Kernel name'
        required: true
        default: 'citrus'
      config:
        description: 'Defconfig (tanpa _defconfig)'
        required: true
        default: 'vendor/citrus-perf'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Jakarta
      CONFIG: ${{ github.event.inputs.config }}
      KERNELNAME: ${{ github.event.inputs.kernelname }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf python3 aria2 cpio

      - name: Fix python2 symlink
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          python2 --version || true

      - name: Clone AOSP Clang 20
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          cd prebuilts/clang/host/linux-x86/clang-r547379
          aria2c -x 16 -s 16 -k 1M \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz
          tar -xzf clang.tar.gz || tar -xf clang.tar.gz
          rm -f clang.tar.gz
          cd -

      - name: Export build vars
        run: |
          echo "KERNEL_DIR=$PWD" >> $GITHUB_ENV
          echo "$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin" >> $GITHUB_PATH

      - name: Start kernel build
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=Reiame
          export KBUILD_BUILD_HOST=Mika

          mkdir -p out
          make O=out "${CONFIG}_defconfig"
          make -j"$(nproc --all)" O=out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.KERNELNAME }}
          path: |
            out/Image.gz-dtb
            out/Image.gz
          if-no-files-found: warn
